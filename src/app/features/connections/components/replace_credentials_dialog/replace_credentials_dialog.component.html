<h2 mat-dialog-title>{{ t('Replace credentials') }}</h2>

<mat-dialog-content>
  <p class="replace-credentials__intro">{{ intro_text() }}</p>

  <div class="replace-credentials__fields">
    <mat-form-field appearance="outline">
      <mat-label>{{ t('Client ID (optional)') }}</mat-label>
      <input
        matInput
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        [formField]="form.client_id"
        (input)="on_client_id_edited()"
        data-testid="replace-credentials-client-id"
      />
      <mat-hint>{{ t('Leave blank to keep the current client ID.') }}</mat-hint>
      @if (form.client_id().errors()[0]; as error) {
        <mat-error>{{ error.message }}</mat-error>
      }
    </mat-form-field>

    <hch-secret-entry-form
      [fields]="secret_fields()"
      [configured]="configured"
      [saving_key]="saving_key()"
      (field_saved)="on_secret_saved($event)"
    ></hch-secret-entry-form>
  </div>

  @if (form_error(); as message) {
    <p class="replace-credentials__error" role="alert" data-testid="replace-credentials-error">
      <mat-icon aria-hidden="true">error</mat-icon>
      <span>{{ message }}</span>
    </p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    mat-dialog-close
    [disabled]="is_saving()"
    data-testid="replace-credentials-cancel"
  >
    {{ t('Cancel') }}
  </button>
</mat-dialog-actions>
