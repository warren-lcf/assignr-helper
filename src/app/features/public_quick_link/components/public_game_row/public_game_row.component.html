<div class="game-row" [attr.data-testid]="'public-game-' + game().game_id">
  <p class="game-row__time" [attr.data-testid]="'public-game-time-' + game().game_id">
    {{ game().start_at | hchUserDate: time_format : game().time_zone }}
  </p>

  <div class="game-row__body">
    <p class="game-row__title" [attr.data-testid]="'public-game-title-' + game().game_id">
      {{ title() }}
    </p>

    @if (game().venue_name; as venue_name) {
      <p class="game-row__meta">
        <mat-icon aria-hidden="true">place</mat-icon>
        <span class="visually-hidden">{{ t('Venue') }}:</span>
        <span>{{ venue_name }}</span>
      </p>
    }

    @if (slot_chips().length > 0) {
      <div
        class="game-row__chips"
        role="group"
        [attr.aria-label]="t('Positions')"
        [attr.data-testid]="'public-game-positions-' + game().game_id"
      >
        @for (chip of slot_chips(); track $index) {
          <hch-status-chip
            [label]="chip.label"
            [tone]="chip.tone"
            [icon]="chip.icon"
            compact
            [attr.data-testid]="'public-game-position-' + game().game_id + '-' + $index"
          ></hch-status-chip>
        }
      </div>
    }

    <div class="game-row__chips">
      @for (tag of tags(); track tag) {
        <hch-status-chip [label]="tag" [tone]="tone.NEUTRAL" compact></hch-status-chip>
      }
      <hch-status-chip
        [label]="spots_text()"
        [tone]="has_open_spots() ? tone.SUCCESS : tone.NEUTRAL"
        [icon]="has_open_spots() ? 'event_seat' : 'block'"
        [attr.data-testid]="'public-game-spots-' + game().game_id"
      ></hch-status-chip>
    </div>
  </div>
</div>
